# ============================================
# Render.com Infrastructure as Code
# ============================================

services:
  # API Backend
  - type: web
    name: pos-saas-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: pos-saas-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: pos-saas-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: TENANT_BASE_DOMAIN
        sync: false
        value: your-domain.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        value: noreply@your-domain.com
      - key: SENTRY_DSN
        sync: false
    preDeployCommand: npx prisma migrate deploy
    buildCommand: pnpm install --frozen-lockfile && cd apps/api && pnpm prisma:generate && pnpm build

  # PostgreSQL Database
  - type: postgresql
    name: pos-saas-db
    plan: starter
    databaseName: pos_saas
    ipAllowList: []

  # Redis
  - type: redis
    name: pos-saas-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
